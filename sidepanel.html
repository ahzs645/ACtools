<!doctype html>
<html lang="en" data-surface="sidepanel">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AC Tools</title>
    <script src="surface-bootstrap.js"></script>
  </head>
  <body>
    <div id="app">
      <header class="app-bar">
        <button id="home-button" type="button" class="app-bar__brand app-bar__home" aria-label="Go to AC Tools home" title="AC Tools home">
          <span class="app-bar__logo" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
              <rect x="4" y="4" width="6" height="6" rx="1.2" />
              <rect x="14" y="4" width="6" height="6" rx="1.2" />
              <rect x="4" y="14" width="6" height="6" rx="1.2" />
              <rect x="14" y="14" width="6" height="6" rx="1.2" />
            </svg>
          </span>
          <span class="app-bar__title" id="app-title">AC Tools</span>
        </button>
        <div class="app-bar__actions">
          <button
            id="theme-toggle"
            type="button"
            class="icon-button"
            aria-label="Toggle theme"
            title="Toggle theme"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
            </svg>
          </button>
          <button
            id="settings-button"
            type="button"
            class="icon-button"
            aria-label="Settings"
            title="Settings"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="12" cy="12" r="3" />
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06A2 2 0 1 1 4.21 17.9l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06A2 2 0 1 1 7.04 4.27l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
            </svg>
          </button>
        </div>
      </header>

      <!-- @include src/popup/html/launcher.html -->

      <section id="view-detail" class="view" aria-labelledby="detail-title" hidden>
        <header class="detail-header">
          <button
            id="detail-back"
            type="button"
            class="detail-header__back"
            aria-label="Back to apps"
            title="Back to apps"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.75"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M19 12H5" />
              <path d="m12 19-7-7 7-7" />
            </svg>
          </button>
          <div id="detail-header-text" class="detail-header__text">
            <h2 id="detail-title" class="detail-header__title">Tool</h2>
            <p id="detail-subtitle" class="detail-header__subtitle"></p>
          </div>
        </header>

        <div class="detail-body">
          <!-- @include src/popup/html/panels/availability.html -->

          <!-- @include src/popup/html/panels/shift-lab.html -->

          <!-- @include src/popup/html/panels/employee-manager.html -->

          <!-- @include src/popup/html/panels/environment-manager.html -->

          <!-- @include src/popup/html/panels/about.html -->

          <!-- @include src/popup/html/panels/planned.html -->

          <!-- @include src/popup/html/panels/day-view.html -->

          <!-- @include src/popup/html/panels/form-context-catalog.html -->

          <!-- @include src/popup/html/panels/client-chart-export.html -->

          <!-- @include src/popup/html/panels/connector-utilities.html -->

          <!-- @include src/popup/html/panels/settings.html -->

          <div id="result-container" class="result">
            <span id="result-label" class="section-label">Result</span>
            <pre id="result-text" class="result__output">Ready.</pre>
          </div>
        </div>
      </section>
    </div>

    <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="false"></div>

    <script type="module" src="/src/popup/main.ts"></script>
  </body>
</html>
